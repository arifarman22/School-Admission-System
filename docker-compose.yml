name: school-admission

services:
  migrate:
    build:
      context: ./database-service
      target: migrate
    restart: 'no'
    environment:
      DIRECT_URL: ${DIRECT_URL:-}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL) in .env}
    networks: [egress]

  database-service:
    build: ./database-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL) in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      LOG_LEVEL: info
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      RESERVATION_LOCK_TIMEOUT_MS: ${RESERVATION_LOCK_TIMEOUT_MS:-5000}
      RESERVATION_TX_TIMEOUT_MS: ${RESERVATION_TX_TIMEOUT_MS:-15000}
    expose:
      - '4000'
    networks: [internal, egress]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      DatabaseService__BaseUrl: http://database-service:4000
      DatabaseService__ApiKey: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      database-service:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks: [public, internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    networks: [public]

networks:
  public:
  internal:
    internal: true
  egress:
